name: Vanta Code Dev

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe the Vanta code change to implement"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vanta-code-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code-dev:
    name: Generate, test, and build a safe code update
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected Vanta branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Generate source-only patch with NVIDIA NIM
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          CODE_DEV_TASK: ${{ inputs.task }}
        run: python scripts/code_dev_agent.py

      - name: Validate and apply patch
        run: |
          set -euo pipefail
          git apply --check code-dev.patch
          git apply code-dev.patch
          git diff --check
          git diff --stat

      - name: Run tests and build APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Code Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: vanta-code-dev-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish validated change as a separate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODE_DEV_TASK: ${{ inputs.task }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "The requested task produced no source changes."
            exit 1
          fi
          BRANCH="code-dev/${GITHUB_RUN_NUMBER}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/vanta/app app/src/test/java/com/vanta/app app/src/main/res app/src/main/AndroidManifest.xml 2>/dev/null || true
          git diff --cached --check
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No approved source changes remained after path filtering."
            exit 1
          fi
          git commit -m "Code Dev: implement validated source update"
          git push origin "$BRANCH"
          printf 'Task requested:

%s

Validation: `gradle testDebugUnitTest assembleDebug` passed.

The APK is available as the workflow artifact. Review all changes before merging.
' "$CODE_DEV_TASK" > /tmp/pr-body.md
          gh pr create --repo "$GH_REPO" --base "$BASE_BRANCH" --head "$BRANCH" --title "Code Dev: validated update #${GITHUB_RUN_NUMBER}" --body-file /tmp/pr-body.md
