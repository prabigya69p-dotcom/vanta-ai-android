name: Vanta Full Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main, fix/hands-free-wake-word, 'feat/**']

permissions:
  contents: read

jobs:
  gemini-api:
    name: Test Gemini API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send a minimal prompt to Gemini
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_API_KEY:-}" ]; then
            echo "GOOGLE_API_KEY secret is missing. Add it in repository Actions secrets."
            exit 1
          fi

          # Keep this smoke test fast: Gemini 3.8 Flash defaults to medium thinking.
          PAYLOAD=$(jq -n '{
            contents: [{parts: [{text: "Reply with only the word OK."}]}],
            generationConfig: {
              thinkingConfig: {thinkingLevel: "low"},
              maxOutputTokens: 64
            }
          }')

          CODE=000
          CURL_EXIT=0
          for attempt in 1 2 3; do
            echo "Gemini API request attempt $attempt/3..."
            rm -f /tmp/gemini.json
            set +e
            CODE=$(curl -sS --connect-timeout 15 --max-time 45 \
              -o /tmp/gemini.json -w '%{http_code}' \
              -X POST 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent' \
              -H "x-goog-api-key: $GOOGLE_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD")
            CURL_EXIT=$?
            set -e

            if [ "$CODE" = "200" ]; then
              break
            fi

            # Retry only transient network, rate-limit, and server failures.
            if { [ "$CODE" = "000" ] || [ "$CODE" = "429" ] || [[ "$CODE" =~ ^5[0-9][0-9]$ ]]; } && [ "$attempt" -lt 3 ]; then
              WAIT=$((attempt * 5))
              echo "Transient Gemini failure (HTTP $CODE, curl exit $CURL_EXIT); retrying in ${WAIT}s."
              sleep "$WAIT"
              continue
            fi
            break
          done

          if [ "$CODE" != "200" ]; then
            echo "Gemini API failed after $attempt attempt(s): HTTP $CODE, curl exit $CURL_EXIT."
            if [ -s /tmp/gemini.json ]; then
              jq -c '{error: {code: .error.code, status: .error.status, message: .error.message}}' /tmp/gemini.json 2>/dev/null | head -c 800 || head -c 800 /tmp/gemini.json || true
            fi
            if [ "$CODE" = "000" ]; then
              echo "No HTTP response was received. Check transient network/API availability; this does not by itself mean the key is invalid."
            elif [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
              echo "Check GOOGLE_API_KEY and whether Gemini API access is enabled for that key."
            fi
            exit 1
          fi

          if ! jq -e '[.candidates[0].content.parts[]?.text // empty] | join("") | length > 0' /tmp/gemini.json >/dev/null; then
            echo "Gemini returned HTTP 200 but no assistant text."
            jq -c '{error, promptFeedback, candidates}' /tmp/gemini.json 2>/dev/null | head -c 1000 || true
            exit 1
          fi
          echo "Gemini API passed: gemini-3.8-flash returned assistant text."
  nvidia-nim:
    name: Test NVIDIA NIM / GLM
    runs-on: ubuntu-latest
    steps:
      - name: Check NVIDIA NIM API
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "NVIDIA_API_KEY secret is missing."
            exit 1
          fi

          MODEL="${NVIDIA_MODEL:-z-ai/glm-5.3-flash}"
          PAYLOAD=$(jq -n --arg model "$MODEL" '{
            model: $model,
            messages: [{role:"user", content:"Reply with only the word OK."}],
            temperature: 0.2,
            max_tokens: 4096,
            stream: false,
            reasoning_effort: "low"
          }')
          CODE=000
          for attempt in 1 2 3; do
            echo "NVIDIA NIM request attempt $attempt/3..."
            CODE=$(curl -sS --connect-timeout 20 --max-time 120 \
              -o /tmp/nim.json -w '%{http_code}' \
              https://integrate.api.nvidia.com/v1/chat/completions \
              -H "Authorization: Bearer $NVIDIA_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD" || true)
            if [ "$CODE" = "200" ]; then
              break
            fi
            if [[ "$CODE" =~ ^5[0-9][0-9]$ ]] && [ "$attempt" -lt 3 ]; then
              echo "NVIDIA NIM gateway/server error HTTP $CODE; retrying in 10 seconds."
              sleep 10
              continue
            fi
            break
          done

          if [ "$CODE" != "200" ]; then
            echo "NVIDIA NIM returned HTTP $CODE after retry attempts."
            jq -c '{error, detail, message}' /tmp/nim.json 2>/dev/null | head -c 800 || true
            if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
              echo "This usually indicates an invalid key or missing model access."
            elif [[ "$CODE" =~ ^5[0-9][0-9]$ ]] || [ "$CODE" = "000" ]; then
              echo "This looks like a temporary NVIDIA service/network timeout, not proof that the API key is invalid."
            fi
            exit 1
          fi

          if ! jq -e '(.choices[0].message.content // "") | strings | length > 0' /tmp/nim.json >/dev/null; then
            echo "NVIDIA NIM returned HTTP 200 but no assistant text."
            jq -c '{error, detail, message, choices: [(.choices // [])[] | {finish_reason, message: {content: .message.content, reasoning_content: .message.reasoning_content}}]}' /tmp/nim.json 2>/dev/null | head -c 1000 || true
            exit 1
          fi

          echo "NVIDIA NIM passed: $MODEL returned assistant text."

  fish-audio:
    name: Test Fish Audio authentication and speech
    runs-on: ubuntu-latest
    steps:
      - name: Generate sample speech
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FISH_API_KEY:-}" ]; then
            echo "FISH_API_KEY secret is missing. Add it in repository Actions secrets."
            exit 1
          fi

          CODE=$(curl -sS -o /tmp/fish-response.bin -w '%{http_code}' \
            -X POST https://api.fish.audio/v1/tts \
            -H "Authorization: Bearer $FISH_API_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Accept: audio/mpeg' \
            -H 'model: s2.1-pro-free' \
            -d '{"text":"Vanta voice test.","format":"mp3"}')

          if [ "$CODE" != "200" ] || [ ! -s /tmp/fish-response.bin ]; then
            echo "Fish Audio speech generation failed (HTTP $CODE). Check the key, model access, and quota."
            jq -c '{detail, message, error}' /tmp/fish-response.bin 2>/dev/null | head -c 800 || true
            exit 1
          fi

          if ! file /tmp/fish-response.bin | grep -Eiq 'MPEG|ID3|audio'; then
            echo "Fish Audio returned HTTP 200 but the response does not look like an audio file."
            exit 1
          fi
          echo "Fish Audio generated an audio response successfully."

  android-tests:
    name: Build, install, and launch Vanta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle for this project (wrapper is not committed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK platform required by the project
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
          # Android's API 37 SDK package uses the android-37.0 directory name.
          # Some AGP builds still resolve compileSdk 37 via android-37, so add the alias.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Verify Android project files
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Create standard Android debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android unit tests and build APK
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ vars.FISH_VOICE_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Print debug signing SHA-1 fingerprint
        run: |
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'Alias name:|SHA1:'
          else
            echo "Debug keystore not found; Gradle may not have generated it."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vanta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Boot emulator, install and launch APK
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35 successfully booted in the prior run; API 33 did not boot
          # before the step timeout in the latest run.
          api-level: 35
          arch: x86_64
          emulator-boot-timeout: 720
          # The action's script does not assume its process starts in the repo.
          working-directory: ${{ github.workspace }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/emulator-smoke-test.sh
